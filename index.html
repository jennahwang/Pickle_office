<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2033">
<title>피클 오피스 · 할 일 현황판</title>
<meta name="description" content="픽셀 캐릭터가 돌아다니는 개인 사무실 겸 할 일 현황판">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231c2033'/%3E%3Crect x='4' y='3' width='8' height='2' fill='%23f2d21f'/%3E%3Crect x='4' y='3' width='2' height='10' fill='%23f2d21f'/%3E%3Crect x='4' y='11' width='8' height='2' fill='%23f2d21f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css?v=6">
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>피클 오피스</h1>
        <p class="brand-sub">개인 사무실 · 할 일 현황판</p>
      </div>
    </div>
    <div class="topbar-right">
      <span class="sync-dot" id="syncDot" title="동기화 상태"><i></i><span id="syncText">로컬</span></span>
      <button class="icon-btn" id="settingsBtn" title="동기화 설정" aria-label="동기화 설정">⚙</button>
    </div>
  </header>

  <main class="stage">
    <section class="office-wrap">
      <div class="office-frame" id="officeFrame">
        <canvas id="office" width="320" height="192" aria-label="픽셀 오피스 맵"></canvas>
        <div class="overlay" id="overlay" aria-hidden="true"></div>
      </div>
      <div class="legend" id="legend">
        <button class="legend-chip" data-zone="store"><b>매장 업무</b><span id="cnt-store">0</span></button>
        <button class="legend-chip" data-zone="board"><b>현황판</b><span id="cnt-board">0</span></button>
        <button class="legend-chip" data-zone="life"><b>일상·위스키</b><span id="cnt-life">0</span></button>
        <button class="legend-chip" data-zone="break"><b>휴식</b><span id="cnt-break">0</span></button>
      </div>
      <p class="hint" id="hint">맵의 존을 눌러 할 일을 보고, 캐릭터를 눌러 인사해 보세요.</p>
    </section>

    <aside class="panel" id="panel">
      <div class="panel-grip" id="panelGrip" aria-hidden="true"></div>
      <div class="panel-head">
        <div>
          <h2 id="panelTitle">전체 할 일</h2>
          <p class="panel-sub" id="panelSub">오늘의 진행 상황</p>
        </div>
        <button class="ghost-btn" id="clearFilter" hidden>전체 보기</button>
      </div>

      <div class="stats" id="stats">
        <div class="stat"><b id="stActive">0</b><span>진행</span></div>
        <div class="stat"><b id="stPending">0</b><span>대기</span></div>
        <div class="stat"><b id="stDone">0</b><span>완료</span></div>
      </div>

      <form class="add-form" id="addForm" autocomplete="off">
        <input id="newTitle" type="text" placeholder="할 일을 적어 주세요" maxlength="80" required>
        <select id="newZone" aria-label="존 선택">
          <option value="store">매장 업무</option>
          <option value="board">현황판</option>
          <option value="life">일상·위스키</option>
          <option value="break">휴식</option>
        </select>
        <button type="submit" class="primary-btn">추가</button>
      </form>

      <div class="task-list" id="taskList"></div>
      <div class="empty" id="emptyState" hidden>
        <p>여기에 할 일이 없습니다.</p>
      </div>
    </aside>
  </main>

  <footer class="foot">
    <span id="footLeft">픽셀 오피스 · GitHub Pages</span>
    <span id="footRight"></span>
  </footer>
</div>

<!-- 설정 모달 -->
<div class="modal" id="settingsModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h3 id="settingsTitle">동기화 설정</h3>
    <p class="modal-desc">구글 시트에 연결하면 어떤 기기에서든 같은 할 일이 보입니다. 연결하지 않으면 이 브라우저에만 저장됩니다.</p>
    <label class="field">
      <span>동기화 주소 (Apps Script 웹앱 URL)</span>
      <input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    </label>
    <label class="field">
      <span>접속 PIN</span>
      <input id="cfgPin" type="text" inputmode="numeric" placeholder="숫자 4~8자리" maxlength="12">
    </label>
    <p class="modal-msg" id="cfgMsg" hidden></p>
    <div class="modal-actions">
      <button class="ghost-btn" id="cfgDisconnect">연결 해제</button>
      <button class="primary-btn" id="cfgSave">저장 후 확인</button>
    </div>
    <button class="modal-close" id="cfgClose" aria-label="닫기">✕</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="assets/app.js?v=6"></script>
</body>
</html>
