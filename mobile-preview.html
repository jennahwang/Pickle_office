<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>피클 오피스 · 모바일 미리보기</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e17;display:flex;align-items:center;justify-content:center}
  iframe{width:390px;height:844px;border:0;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
</style>
<iframe id="pv" title="피클 오피스 모바일 미리보기"></iframe>
<script>
  // 주소의 #sync=... 값을 그대로 iframe 에 넘긴다(값은 저장소에 남지 않음)
  document.getElementById('pv').src = './index.html?pv=' + Date.now() + location.hash;
</script>
</html>
